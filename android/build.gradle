buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some plugins (e.g. receive_sharing_intent) don't pin their own Java/Kotlin
// compile targets, so they can pick up mismatched defaults (Java 1.8 vs
// Kotlin JVM 17) depending on the JDK running Gradle. Force every module —
// including third-party plugins — to the same consistent target so that
// never happens. Some subprojects (like :app, due to evaluationDependsOn
// above) may already be evaluated by the time this runs, so calling
// afterEvaluate on them would throw — handle both cases.
//
// Uses the modern `compilerOptions` DSL rather than the older
// `kotlinOptions` — that older API is deprecated-with-error in current
// Kotlin Gradle Plugin versions and broke here with a cryptic
// "getJvmDefault()" NoSuchMethodError once one of the newer plugins
// pulled in a Kotlin Gradle Plugin version whose deprecated-shim
// internals no longer lined up with kotlin_version 1.9.24's.
def forceJvmTarget = { proj ->
    if (proj.hasProperty('android')) {
        proj.android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
    }
    proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
        }
    }
}
subprojects {
    if (state.executed) {
        forceJvmTarget(project)
    } else {
        afterEvaluate { forceJvmTarget(project) }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
